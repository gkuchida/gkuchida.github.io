<div class="faq-wrapper">
  <div class="faq-header-card">
    <h2>FAQ - Perguntas Frequentes</h2>
    <p>
      Aqui você encontra respostas para as dúvidas mais comuns sobre nossos produtos, prazos,
      formas de pagamento e encomendas personalizadas. <br>
      Precisa de ajuda?
      <a href="https://wa.me/5541999218178" target="_blank" rel="noopener" class="btn-whatsapp">
        <i class="bi bi-whatsapp"></i>
      </a>
    </p>
  </div>

  <div class="faq-container">
    <div *ngFor="let duvida of duvidas; let i = index" class="faq-item">
      <div class="faq-pergunta" (click)="toggleDuvidas(i)">
        {{ duvida.pergunta }}
        <span class="seta">{{ duvida.aberto ? '▲' : '▼' }}</span>
      </div>

      <div class="faq-resposta" *ngIf="duvida.aberto" [innerHTML]="duvida.resposta"></div>
    </div>
  </div>
</div>
<!-- BOTÃO VOLTAR AO TOPO -->
<button
  *ngIf="showBackToTop"
  class="back-to-top-fixed"
  (click)="scrollToTop()">
  <i class="bi bi-arrow-up"></i>
</button>
