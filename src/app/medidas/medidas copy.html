<div class="voltar-pill">
  <button (click)="voltar()">
    <i class="bi bi-arrow-left"></i> Voltar
  </button>
</div>
<div *ngIf="produto" class="medidas-container">

  <div class="form-wrapper">
    <p class="subtitulo">ARTES & FOCINHOS</p>
    <h3 class="titulo-produto">{{ produto.nome }}</h3>
    <div class="linha-amarela"></div>

    <form (ngSubmit)="ok()">
      <label>
        Pescoço (cm) *:
        <input type="text" [(ngModel)]="medidas.pescoco" name="pescoco" required />
      </label>

      <label>
        Tórax (cm) *:
        <input type="text" [(ngModel)]="medidas.torax" name="torax" required />
      </label>

      <label>
        Comprimento (cm) *:
        <input type="text" [(ngModel)]="medidas.comprimento" name="comprimento" required />
      </label>

      <label>
        Observações:
        <textarea [(ngModel)]="medidas.observacoes" name="observacoes"></textarea>
      </label>

      <button type="submit" class="btn-ok">
        OK
      </button>
    </form>
  </div>

  <div class="imagem-ajuda">
    <div class="ajuda-card">
      <img src="https://i.ibb.co/NgzWfjX2/MEDIDAS.jpg" alt="Como medir" />
    </div>
  </div>
</div>

<!-- Botão flutuante lateral direita -->
<button
  class="back-to-top-fixed"
  (click)="scrollToTop()"
  aria-label="Voltar ao topo"
>
  <i class="bi bi-arrow-up"></i>
</button>
